<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Radiation Mode</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  animation: bgShift 8s infinite alternate ease-in-out;
  background: linear-gradient(120deg, #090011, #240026, #001b2a, #32001a);
  background-size: 300% 300%;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const HeartAnimation = () => {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const textParticlesRef = useRef([]);
  const mouseRef = useRef({ x: 0, y: 0, isHovering: false });
  const frameRef = useRef(null);
  const timeRef = useRef(0);
  const sizeRef = useRef({ width: window.innerWidth, height: window.innerHeight });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = sizeRef.current.width;
    canvas.height = sizeRef.current.height;

    createParticles();
    createTextParticles();
    
    const resize = () => {
      sizeRef.current = { width: window.innerWidth, height: window.innerHeight };
      canvas.width = sizeRef.current.width;
      canvas.height = sizeRef.current.height;
      createParticles();
      createTextParticles();
    };
    window.addEventListener('resize', resize);

    let last = performance.now();
    const loop = (t) => {
      const dt = (t-last)*0.001;
      last = t;
      timeRef.current += dt;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      draw(ctx);
      frameRef.current = requestAnimationFrame(loop);
    };
    frameRef.current = requestAnimationFrame(loop);

    return () => { cancelAnimationFrame(frameRef.current); window.removeEventListener('resize', resize); };
  }, []);

  // *** MENOS PARTÍCULAS PARA CELULAR ***
  const createParticles = () => {
    const { width, height } = sizeRef.current;
    const cx = width/2, cy = height/2;
    const size = Math.min(width,height)*0.38;
    const list = [];

    const count = window.innerWidth < 600 ? 900 : 3000; // 👈 MODO CELULAR

    for (let i=0;i<count;i++){
      const t = Math.random()*Math.PI*2;
      let x = 16*Math.sin(t)**3;
      let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      x = cx + x*(size/16);
      y = cy - y*(size/16);

      list.push({
        x,y, ox:x, oy:y,
        size: Math.random()*3+1.5,
        colorHue: Math.random()*30+330,
        vx:(Math.random()*2-1)*0.8,
        vy:(Math.random()*2-1)*0.8,
        pulseOffset: Math.random()*10,
      });
    }
    particlesRef.current=list;
  };

  // *** TEXTO MÁS GRANDE Y CON MENOS PÍXELES ***
  const createTextParticles = () => {
    const { width, height } = sizeRef.current;
    const cx = width / 2;
    const cy = height / 2;
    const heartSize = Math.min(width, height) * 0.38;

    const temp = document.createElement("canvas");
    temp.width = width;
    temp.height = height;
    const ctx = temp.getContext("2d");

    ctx.fillStyle = "white";
    ctx.font = `${Math.min(width,height)*0.19}px Arial Black`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText("TE AMO!!", cx, cy - heartSize * 0.9);

    const imgData = ctx.getImageData(0,0,width,height).data;
    const list = [];

    const step = window.innerWidth < 600 ? 9 : 6; // 👈 MENOS DENSIDAD EN CELULAR

    for(let y=0; y<height; y+=step){
      for(let x=0; x<width; x+=step){
        const i = (y*width + x)*4;
        if(imgData[i+3] > 128){
          list.push({ x,y, ox:x, oy:y, size:2.6 });
        }
      }
    }
    textParticlesRef.current = list;
  };

  const draw = (ctx) => {
    const t = timeRef.current;

    particlesRef.current.forEach(p=>{
      p.x += (p.ox-p.x)*0.06 + p.vx;
      p.y += (p.oy-p.y)*0.06 + p.vy;

      const glow = (Math.sin(t*4+p.pulseOffset)+1)/2;
      const color = `hsla(${p.colorHue},100%,${50+glow*30}%,1)`;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
    });

    textParticlesRef.current.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.ox,p.oy,p.size,0,Math.PI*2);
      ctx.fillStyle="white";
      ctx.fill();
    });
  };

  return (
    <canvas ref={canvasRef}
      onMouseMove={(e)=>{mouseRef.current.x=e.clientX;mouseRef.current.y=e.clientY;}}
      onTouchMove={(e)=>{const t=e.touches[0];mouseRef.current={x:t.clientX,y:t.clientY,isHovering:true};}}
      onTouchEnd={()=>mouseRef.current.isHovering=false}
    />
  );
};

ReactDOM.render(<HeartAnimation/>,document.getElementById('root'));
</script>
</body>
</html>
