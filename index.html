    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Radiation Mode</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
        animation: bgShift 8s infinite alternate ease-in-out;
        background: linear-gradient(120deg, #090011, #240026, #001b2a, #32001a);
        background-size: 300% 300%;
        }

        @keyframes bgShift {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
        }

        .toggle-container {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        color: white;
        display: flex;
        align-items: center;
        font-size: 18px;
        text-shadow: 0 0 8px #ff00f7;
        }

        .toggle-switch {
        position: relative;
        width: 60px;
        height: 34px;
        margin-right: 10px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #555;
        transition: .4s;
        border-radius: 34px;
        }

        .toggle-slider:before {
        content: "";
        position: absolute;
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
        }

        input:checked + .toggle-slider { background-color: #ff2ba8; }

        input:checked + .toggle-slider:before { transform: translateX(26px); }
    </style>
    </head>
    <body>
    <div id="root"></div>

    <script type="text/babel">
const { useState, useEffect, useRef } = React;

const HeartAnimation = () => {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]); // partículas del corazón
  const textParticlesRef = useRef([]); // partículas del texto
  const mouseRef = useRef({ x: 0, y: 0, isHovering: false });
  const frameRef = useRef(null);
  const timeRef = useRef(0);
  const sizeRef = useRef({ width: window.innerWidth, height: window.innerHeight });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = sizeRef.current.width;
    canvas.height = sizeRef.current.height;

    createParticles();
    createTextParticles();
    
    const resize = () => {
      sizeRef.current = { width: window.innerWidth, height: window.innerHeight };
      canvas.width = sizeRef.current.width;
      canvas.height = sizeRef.current.height;
      createParticles();
      createTextParticles();
    };
    window.addEventListener('resize', resize);

    let last = performance.now();
    const loop = (t) => {
      const dt = (t-last)*0.001;
      last = t;
      timeRef.current += dt;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      draw(ctx);
      frameRef.current = requestAnimationFrame(loop);
    };
    frameRef.current = requestAnimationFrame(loop);

    return () => { cancelAnimationFrame(frameRef.current); window.removeEventListener('resize', resize); };
  }, []);

  const createParticles = () => {
    const { width, height } = sizeRef.current;
    const cx = width/2, cy = height/2;
    const size = Math.min(width,height)*0.38;
    const list = [];

    for (let i=0;i<3000;i++){
      const t = Math.random()*Math.PI*2;
      let x = 16*Math.sin(t)**3;
      let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      x = cx + x*(size/16);
      y = cy - y*(size/16);

      const angle2 = Math.random()*Math.PI*2;
      const dist = size*(Math.random()*0.6+0.4);
      const sx = x + Math.cos(angle2)*dist;
      const sy = y + Math.sin(angle2)*dist;

      list.push({
        x,y, ox:x, oy:y, sx, sy,
        size: Math.random()*4+2,
        colorHue: Math.random()*30+330,
        vx:(Math.random()*2-1)*1.4,
        vy:(Math.random()*2-1)*1.4,
        pulseOffset: Math.random()*10,
      });
    }
    particlesRef.current=list;
  };

  const createTextParticles = () => {
  const { width, height } = sizeRef.current;
  const cx = width / 2;
  const cy = height / 2;
  const heartSize = Math.min(width, height) * 0.38;

  const temp = document.createElement("canvas");
  temp.width = width;
  temp.height = height;
  const ctx = temp.getContext("2d");

  ctx.fillStyle = "white";
  ctx.font = `${Math.min(width,height)*0.14}px Arial Black`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // ******* AQUÍ SE CORRIGE LA POSICIÓN ********
  ctx.fillText("TE AMO!!", cx, cy - heartSize * 0.9);

  const imgData = ctx.getImageData(0,0,width,height).data;
  const list = [];

  for(let y=0; y<height; y+=6){
    for(let x=0; x<width; x+=6){
      const i = (y*width + x)*4;
      if(imgData[i+3] > 128){
        list.push({
          x, y, ox:x, oy:y,
          size:Math.random()*3+1.3,
          colorHue: Math.random()*30+330,
          pulseOffset: Math.random()*10,
        });
      }
    }
  }

  textParticlesRef.current = list;
};


  const draw = (ctx) => {
    checkHover();
    const t = timeRef.current;

    // PARTÍCULAS DEL CORAZÓN (se dispersan)
    particlesRef.current.forEach(p=>{
      const pulse = 1 + Math.sin(t*2)*0.08;
      const targetX = p.ox*pulse + (1-pulse)*(sizeRef.current.width/2);
      const targetY = p.oy*pulse + (1-pulse)*(sizeRef.current.height/2);

      if(mouseRef.current.isHovering){
        p.x += (p.sx-p.x)*0.25;
        p.y += (p.sy-p.y)*0.25;
      } else {
        p.x += (targetX-p.x)*0.18;
        p.y += (targetY-p.y)*0.18;
      }

      p.x += p.vx;
      p.y += p.vy;

      const glow = (Math.sin(t*4+p.pulseOffset)+1)/2;
      const color = `hsla(${p.colorHue},100%,${50+glow*30}%,1)`;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.shadowBlur=12;
      ctx.shadowColor=color;
      ctx.fill();
    });

    // PARTÍCULAS DEL TEXTO (firmes sin dispersión)
    textParticlesRef.current.forEach(p=>{
      const glow = (Math.sin(t*4+p.pulseOffset)+1)/2;
      const color = `hsla(${p.colorHue},100%,${50+glow*30}%,1)`;

      ctx.beginPath();
      ctx.arc(p.ox,p.oy,p.size,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.shadowBlur=12;
      ctx.shadowColor=color;
      ctx.fill();
    });

  };

  const checkHover = () => {
    const { width, height } = sizeRef.current;
    const cx = width / 2;
    const cy = height / 2;
    const dx = mouseRef.current.x - cx;
    const dy = mouseRef.current.y - cy;
    const distance = Math.sqrt(dx*dx + dy*dy);
    const triggerDistance = Math.min(width, height) * 0.20;
    mouseRef.current.isHovering = distance < triggerDistance;
  };

  return (
    <canvas ref={canvasRef}
      onMouseMove={(e)=>{mouseRef.current.x=e.clientX;mouseRef.current.y=e.clientY;}}
      onMouseEnter={()=>mouseRef.current.isHovering=true}
      onMouseLeave={()=>mouseRef.current.isHovering=false}
    />
  );
};

ReactDOM.render(<HeartAnimation/>,document.getElementById('root'));
</script>

    </body>
    </html>
