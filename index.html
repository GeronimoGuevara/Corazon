<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Radiation Mode</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  animation: bgShift 8s infinite alternate ease-in-out;
  background: linear-gradient(120deg, #090011, #240026, #001b2a, #32001a);
  background-size: 300% 300%;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

/* --- TEXTO TE AMO SIN PARTÍCULAS PERO CON NEÓN --- */
#loveText {
  position: absolute;
  top: 12vh; /* arriba del corazón */
  width: 100%;
  text-align: center;
  font-size: clamp(32px, 9vw, 80px);
  font-weight: 900;
  color: #ffffff;
  text-shadow:
     0 0 9px #ff4dff,
     0 0 18px #ff00f7,
     0 0 28px #ff00f7,
     0 0 50px #ff0099;
  z-index: 10;
}
</style>
</head>
<body>
<div id="loveText">TE AMO</div>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useRef } = React;

const HeartAnimation = () => {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const mouseRef = useRef({ x: 0, y: 0, isHovering: false });
  const frameRef = useRef(null);
  const timeRef = useRef(0);
  const sizeRef = useRef({ width: window.innerWidth, height: window.innerHeight });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    resizeCanvas();

    createParticles();
    
    window.addEventListener('resize', resizeCanvas);

    let last = performance.now();
    const loop = (t) => {
      const dt = (t-last)*0.001;
      last = t;
      timeRef.current += dt;

      ctx.clearRect(0,0,canvas.width,canvas.height);
      draw(ctx);
      frameRef.current = requestAnimationFrame(loop);
    };
    frameRef.current = requestAnimationFrame(loop);

    return () => cancelAnimationFrame(frameRef.current);
  }, []);

  const resizeCanvas = () => {
    sizeRef.current = { width: window.innerWidth, height: window.innerHeight };
    const canvas = canvasRef.current;
    canvas.width = sizeRef.current.width;
    canvas.height = sizeRef.current.height;
    createParticles();
  };

  // Responsive + Rendimiento móvil
  const createParticles = () => {
    const { width, height } = sizeRef.current;
    const cx = width / 2;
    const cy = height / 2;
    const size = Math.min(width, height) * 0.35;

    const count = width < 600 ? 1200 : 3000; // menos partículas en celular
    const list = [];

    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      let x = 16 * Math.sin(t)**3;
      let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);

      x = cx + x * (size/16);
      y = cy - y * (size/16);

      const angle2 = Math.random()*Math.PI*2;
      const dist = size*(Math.random()*0.7+0.3);

      list.push({
        x, y,
        ox: x, oy: y,
        sx: x + Math.cos(angle2)*dist,
        sy: y + Math.sin(angle2)*dist,
        size: Math.random()*3+1.5,
        colorHue: Math.random()*30+330,
        pulseOffset: Math.random()*10,
        vx:(Math.random()*2-1)*0.8,
        vy:(Math.random()*2-1)*0.8,
      });
    }
    particlesRef.current = list;
  };

  const draw = (ctx) => {
    const t = timeRef.current;

    particlesRef.current.forEach(p=>{
      if(mouseRef.current.isHovering){
        p.x += (p.sx - p.x) * 0.25;
        p.y += (p.sy - p.y) * 0.25;
      } else {
        p.x += (p.ox - p.x) * 0.12;
        p.y += (p.oy - p.y) * 0.12;
      }

      p.x += p.vx * 0.2;
      p.y += p.vy * 0.2;

      const glow = (Math.sin(t*4+p.pulseOffset)+1)/2;
      const color = `hsla(${p.colorHue},100%,${55+glow*25}%,1)`;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle = color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;
      ctx.fill();
    });
  };

  return (
    <canvas ref={canvasRef}
      onMouseMove={(e)=>{mouseRef.current={x:e.clientX,y:e.clientY,isHovering:true};}}
      onMouseLeave={()=>mouseRef.current.isHovering=false}
      onTouchMove={(e)=>{const t=e.touches[0];mouseRef.current={x:t.clientX,y:t.clientY,isHovering:true};}}
      onTouchEnd={()=>mouseRef.current.isHovering=false}
    />
  );
};

ReactDOM.render(<HeartAnimation/>,document.getElementById('root'));
</script>
</body>
</html>
